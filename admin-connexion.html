<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion admin — Prime IPTV Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C14; --panel:#121826; --gold:#E7A94C;
    --text:#F2F0EA; --muted:#8B93A7; --line:#232B3D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px 26px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;margin-bottom:6px;}
  p{color:var(--muted);font-size:13.5px;margin-bottom:20px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;margin-top:14px;}
  input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:6px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;
  }
  button{
    width:100%;margin-top:22px;background:var(--gold);color:#1A1305;font-weight:600;
    padding:12px;border-radius:6px;border:none;font-size:14.5px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .err{color:#E76B5C;font-size:13px;margin-top:12px;display:none;}
</style>
</head>
<body>

<div class="card">
  <h1>Espace admin</h1>
  <p>Prime IPTV Streaming</p>

  <label for="u">Nom d'utilisateur</label>
  <input type="text" id="u">

  <label for="p">Mot de passe</label>
  <input type="password" id="p">

  <div class="err" id="err"></div>

  <button id="btn">Se connecter</button>
</div>

<script>
  document.getElementById("btn").onclick = function(){
    const u = document.getElementById("u").value.trim();
    const p = document.getElementById("p").value;
    const errEl = document.getElementById("err");
    const btn = document.getElementById("btn");

    if (!u || !p) {
      errEl.textContent = "Remplis les deux champs.";
      errEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Connexion...";

    fetch("https://vnceunqygoiwglnwpgcr.supabase.co/functions/v1/admin-iptv", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "login", username: u, password: p })
    }).then(r => r.json()).then(function(resultat){
      if (resultat.success) {
        sessionStorage.setItem("prime_admin_user", u);
        sessionStorage.setItem("prime_admin_pass", p);
        window.location.href = "admin-espace.html";
      } else {
        errEl.textContent = resultat.message || "Identifiants incorrects.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Se connecter";
      }
    }).catch(function(){
      errEl.textContent = "Erreur de connexion. Reessaie.";
      errEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Se connecter";
    });
  };
</script>

</body>
</html>
