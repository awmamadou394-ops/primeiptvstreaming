<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement confirmé — Prime IPTV Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C14;
    --panel:#121826;
    --gold:#E7A94C;
    --cyan:#35D0C0;
    --text:#F2F0EA;
    --muted:#8B93A7;
    --line:#232B3D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:34px 28px;text-align:center;
  }
  .icon{
    width:56px;height:56px;border-radius:50%;background:rgba(53,208,192,0.15);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    font-size:28px;color:var(--cyan);
  }
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;margin-bottom:10px;}
  p{color:var(--muted);font-size:14.5px;line-height:1.6;margin-bottom:8px;}
  .recap{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin:18px 0;font-size:14px;color:var(--gold);font-weight:600;
  }
  .status{font-size:13px;color:var(--muted);margin-top:14px;}
  a.btn{
    display:inline-block;margin-top:22px;background:var(--gold);color:#1A1305;
    font-weight:600;padding:12px 26px;border-radius:6px;text-decoration:none;font-size:14.5px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">✓</div>
  <h1>Merci pour votre commande !</h1>
  <p>Votre paiement a bien été reçu par Prime IPTV Streaming.</p>
  <div class="recap" id="recap"></div>
  <p>Vos identifiants de connexion vous seront envoyés directement par email dès leur préparation.</p>
  <p class="status" id="status">Vérification du statut du paiement...</p>
  <a href="index.html" class="btn">Retour à l'accueil</a>
</div>

<script>
  const ticketBrut = localStorage.getItem("prime_dernier_ticket");
  const recapEl = document.getElementById("recap");
  const statusEl = document.getElementById("status");

  if (ticketBrut) {
    try {
      const ticket = JSON.parse(ticketBrut);
      recapEl.textContent = (ticket.duree || "") + " — " + (ticket.prix || "") + " " + (ticket.devise || "");

      fetch("https://vnceunqygoiwglnwpgcr.supabase.co/functions/v1/paytech-check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ table: "abonnements_iptv", id: ticket.id })
      }).then(r => r.json()).then(function(resultat){
        if (resultat && (resultat.statut_paiement === "paye" || resultat.paye === true)) {
          statusEl.textContent = "Paiement confirmé.";
        } else {
          statusEl.textContent = "Confirmation en cours de traitement — vous recevrez un email sous peu.";
        }
      }).catch(function(){
        statusEl.textContent = "Vous recevrez la confirmation par email sous peu.";
      });

      localStorage.removeItem("prime_dernier_ticket");
    } catch (e) {
      statusEl.textContent = "";
    }
  } else {
    statusEl.textContent = "";
  }
</script>

</body>
</html>
