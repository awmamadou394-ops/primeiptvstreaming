<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé — Prime IPTV Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C14;
    --panel:#121826;
    --gold:#E7A94C;
    --muted:#8B93A7;
    --text:#F2F0EA;
    --line:#232B3D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:34px 28px;text-align:center;
  }
  .icon{
    width:56px;height:56px;border-radius:50%;background:rgba(231,169,76,0.15);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    font-size:26px;color:var(--gold);
  }
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;margin-bottom:10px;}
  p{color:var(--muted);font-size:14.5px;line-height:1.6;}
  a.btn{
    display:inline-block;margin-top:22px;background:var(--gold);color:#1A1305;
    font-weight:600;padding:12px 26px;border-radius:6px;text-decoration:none;font-size:14.5px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">✕</div>
  <h1>Paiement annulé</h1>
  <p>Votre commande n'a pas été finalisée. Vous pouvez réessayer à tout moment.</p>
  <a href="index.html" class="btn">Retour à l'accueil</a>
</div>

</body>
</html>
